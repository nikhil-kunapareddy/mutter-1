[project]
name = "mutter"
version = "0.1.0"
description = "A small Conformer-CTC speech-to-text model trained from scratch on LibriSpeech"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sentencepiece>=0.2",
    "jiwer>=3.0",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutter"]
